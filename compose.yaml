name: protein3d

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protein3d}
      POSTGRES_USER: ${POSTGRES_USER:-protein3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protein3d_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protein3d} -d ${POSTGRES_DB:-protein3d}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [protein3d]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-protein3d}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-protein3d_minio_local_only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [protein3d]

  cassandra:
    image: cassandra:5.0.9
    profiles: ["graph"]
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: protein3d
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks: [protein3d]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    profiles: ["graph"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [protein3d]

  janusgraph:
    image: janusgraph/janusgraph:1.2.0
    profiles: ["graph"]
    restart: unless-stopped
    environment:
      JANUS_PROPS_TEMPLATE: cql-es
      janusgraph.storage.hostname: cassandra
      janusgraph.index.search.hostname: elasticsearch
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JANUSGRAPH_PORT:-8182}:8182"
    volumes:
      - janusgraph_data:/var/lib/janusgraph
    healthcheck:
      test: ["CMD-SHELL", "bin/gremlin.sh -e scripts/remote-connect.groovy >/dev/null 2>&1"]
      interval: 20s
      timeout: 30s
      retries: 15
      start_period: 90s
    networks: [protein3d]

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: ["vector"]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [protein3d]

  milvus:
    image: milvusdb/milvus:v2.6.26
    profiles: ["vector"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-protein3d}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-protein3d_minio_local_only}
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./configs/milvus.user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks: [protein3d]

networks:
  protein3d:
    name: protein3d

volumes:
  postgres_data:
  minio_data:
  cassandra_data:
  elasticsearch_data:
  janusgraph_data:
  etcd_data:
  milvus_data:
