name: Python CI

on:
  push:
    branches:
      - project/Protein3D-PPI
      - 'feat/**'
  pull_request:
    branches:
      - project/Protein3D-PPI

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve and install locked project environment
        run: |
          uv lock --check
          uv sync --locked

      - name: Ruff lint
        run: uvx --from ruff==0.14.5 ruff check .

      - name: Ruff format check
        run: uvx --from ruff==0.14.5 ruff format --diff src/protein3d/ingestion/alphafold.py tests/unit/test_alphafold.py tests/unit/test_alphafold_crawler.py

      - name: Mypy
        run: uv run --locked mypy src tests

      - name: Unit tests
        run: uv run --locked pytest -m unit

      - name: PostgreSQL integration tests
        run: uv run --locked pytest -m integration

      - name: Package and CLI smoke checks
        run: |
          uv run --locked protein3d --help
          uv run --locked python -c "import protein3d; print(protein3d.__version__)"

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: docker compose version

      - name: Validate default and optional profiles
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile graph config --quiet
          docker compose --env-file .env.example --profile vector config --quiet
          docker compose --env-file .env.example --profile graph --profile vector config --quiet
