name: Rust CI

on:
  push:
    branches:
      - "project/3D-map-medical"
      - "feat/**"
  workflow_dispatch:
  pull_request:
    branches:
      - "project/3D-map-medical"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test and build Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: backend
        run: cargo test --lib --all-features

      - name: Upload resolved Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: kan-15-cargo-lock
          path: backend/Cargo.lock
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/deployment/Dockerfile \
            --tag gis-backend:ci \
            backend

  testcontainers-integration:
    name: Axum API integration tests with Testcontainers PostGIS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run API integration tests (Testcontainers)
        working-directory: backend
        run: cargo test --test buildings_api --test region_building_details_api -- --nocapture

  postgis-integration:
    name: Docker Compose + PostGIS migration verification
    runs-on: ubuntu-latest
    environment: 3d-gis
    needs: [test, testcontainers-integration]
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack with Docker Compose Action
        uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
        with:
          compose-file: ./docker-compose.yml
          up-flags: --build --wait --wait-timeout 180
          down-flags: --remove-orphans
          services-log-level: info

      - name: Verify PostGIS extension and SQLx migrations
        shell: bash
        run: |
          set -euo pipefail

          # Wait until backend has connected to Postgres and applied SQLx migrations.
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U appuser -d appdb >/dev/null 2>&1 \
              && [ "$(docker compose exec -T postgres psql -U appuser -d appdb -tAc "SELECT to_regclass('public.regions')")" = "regions" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for PostGIS schema migration."
              docker compose logs postgres backend
              exit 1
            fi
            sleep 2
          done

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U appuser -d appdb <<'SQL'
          DO $schema$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'postgis') THEN
              RAISE EXCEPTION 'PostGIS extension is not enabled';
            END IF;

            IF to_regclass('public.regions') IS NULL THEN
              RAISE EXCEPTION 'regions table is missing';
            END IF;

            IF to_regclass('public.buildings') IS NULL THEN
              RAISE EXCEPTION 'buildings table is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM geometry_columns
              WHERE f_table_schema = 'public'
                AND f_table_name = 'regions'
                AND f_geometry_column = 'boundary'
                AND type = 'MULTIPOLYGON'
                AND srid = 4326
            ) THEN
              RAISE EXCEPTION 'regions.boundary must be MultiPolygon / EPSG:4326';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM geometry_columns
              WHERE f_table_schema = 'public'
                AND f_table_name = 'buildings'
                AND f_geometry_column = 'footprint'
                AND type = 'MULTIPOLYGON'
                AND srid = 4326
            ) THEN
              RAISE EXCEPTION 'buildings.footprint must be MultiPolygon / EPSG:4326';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='regions_boundary_gist_idx') THEN
              RAISE EXCEPTION 'regions GiST index is missing';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='buildings_footprint_gist_idx') THEN
              RAISE EXCEPTION 'buildings GiST index is missing';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='buildings_region_id_idx') THEN
              RAISE EXCEPTION 'buildings.region_id B-tree index is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.table_constraints
              WHERE table_schema='public' AND table_name='buildings'
                AND constraint_type='FOREIGN KEY'
                AND constraint_name='buildings_region_id_fkey'
            ) THEN
              RAISE EXCEPTION 'buildings.region_id foreign key is missing';
            END IF;
          END $schema$;

          -- Exercise real inserts, constraints and spatial operations in a
          -- transaction so the integration database remains clean.
          BEGIN;

          DO $behavior$
          DECLARE
            region_uuid UUID;
            building_uuid UUID;
            intersects_result BOOLEAN;
            area_m2 DOUBLE PRECISION;
          BEGIN
            INSERT INTO regions (
              code, name, boundary_method, boundary
            ) VALUES (
              'ci-kan13-aoi',
              'KAN-13 CI test AOI',
              'local_aoi',
              ST_GeomFromText(
                'MULTIPOLYGON(((106.69 10.76, 106.71 10.76, 106.71 10.78, 106.69 10.78, 106.69 10.76)))',
                4326
              )
            )
            RETURNING id INTO region_uuid;

            IF region_uuid IS NULL THEN
              RAISE EXCEPTION 'regions.id UUID default was not generated';
            END IF;

            INSERT INTO buildings (
              external_id, osm_type, osm_way_id, region_id, building_type, footprint
            ) VALUES (
              'way/900000001',
              'way',
              900000001,
              region_uuid,
              'yes',
              ST_GeomFromText(
                'MULTIPOLYGON(((106.695 10.765, 106.696 10.765, 106.696 10.766, 106.695 10.766, 106.695 10.765)))',
                4326
              )
            )
            RETURNING id INTO building_uuid;

            IF building_uuid IS NULL THEN
              RAISE EXCEPTION 'buildings.id UUID default was not generated';
            END IF;

            IF (SELECT external_id FROM buildings WHERE id = building_uuid) <> 'way/900000001'
              OR (SELECT osm_way_id FROM buildings WHERE id = building_uuid) <> 900000001 THEN
              RAISE EXCEPTION 'OSM source identifier was not preserved';
            END IF;

            SELECT ST_Intersects(r.boundary, b.footprint)
              INTO intersects_result
            FROM regions r
            JOIN buildings b ON b.region_id = r.id
            WHERE r.id = region_uuid AND b.id = building_uuid;

            IF intersects_result IS DISTINCT FROM TRUE THEN
              RAISE EXCEPTION 'ST_Intersects did not detect the building inside its region';
            END IF;

            SELECT ST_Area(footprint::geography)
              INTO area_m2
            FROM buildings
            WHERE id = building_uuid;

            IF area_m2 IS NULL OR area_m2 <= 0 THEN
              RAISE EXCEPTION 'Geography area in square meters must be positive';
            END IF;

            -- Unique region code.
            BEGIN
              INSERT INTO regions (code, name, boundary_method, boundary)
              SELECT code, 'duplicate', 'local_aoi', boundary
              FROM regions WHERE id = region_uuid;
              RAISE EXCEPTION 'Expected duplicate regions.code to be rejected';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            -- Unique building external_id.
            BEGIN
              INSERT INTO buildings (
                external_id, osm_type, osm_way_id, region_id, footprint
              )
              SELECT external_id, osm_type, osm_way_id, region_id, footprint
              FROM buildings WHERE id = building_uuid;
              RAISE EXCEPTION 'Expected duplicate buildings.external_id to be rejected';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            -- CHECK: osm_type must be way or relation.
            BEGIN
              INSERT INTO buildings (
                external_id, osm_type, osm_way_id, region_id, footprint
              )
              SELECT 'invalid/type', 'node', 900000002, region_uuid, footprint
              FROM buildings WHERE id = building_uuid;
              RAISE EXCEPTION 'Expected invalid osm_type to be rejected';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            -- CHECK: way requires osm_way_id and forbids osm_id.
            BEGIN
              INSERT INTO buildings (
                external_id, osm_type, osm_id, osm_way_id, region_id, footprint
              )
              SELECT 'way/mismatched', 'way', 900000003, NULL, region_uuid, footprint
              FROM buildings WHERE id = building_uuid;
              RAISE EXCEPTION 'Expected mismatched OSM identifiers to be rejected';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            -- FK: region must exist.
            BEGIN
              INSERT INTO buildings (
                external_id, osm_type, osm_way_id, region_id, footprint
              )
              SELECT 'way/orphan', 'way', 900000004,
                     '00000000-0000-0000-0000-000000000001'::UUID, footprint
              FROM buildings WHERE id = building_uuid;
              RAISE EXCEPTION 'Expected invalid region_id to be rejected';
            EXCEPTION WHEN foreign_key_violation THEN
              NULL;
            END;

            -- NOT NULL: external_id is required.
            BEGIN
              INSERT INTO buildings (
                external_id, osm_type, osm_way_id, region_id, footprint
              )
              SELECT NULL, 'way', 900000005, region_uuid, footprint
              FROM buildings WHERE id = building_uuid;
              RAISE EXCEPTION 'Expected NULL external_id to be rejected';
            EXCEPTION WHEN not_null_violation THEN
              NULL;
            END;

            RAISE NOTICE 'KAN-13 behavior checks passed: UUID defaults, OSM identifiers, unique/CHECK/FK/NOT NULL constraints, ST_Intersects and geography area (m²).';
          END $behavior$;

          ROLLBACK;

          SELECT PostGIS_Full_Version();
          SELECT version, success FROM _sqlx_migrations ORDER BY version;
          SELECT 'PostGIS schema and behavior verification passed' AS result;
          SQL

      - name: Print backend logs on failure
        if: failure()
        run: docker compose logs postgres redis backend

  frontend:
    name: Frontend lint, unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: frontend
        run: npm run lint

      - name: Run GIS unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Render (manual)
    runs-on: ubuntu-latest
    needs: [test, testcontainers-integration, postgis-integration]
    # This job runs only when the workflow is manually started from GitHub Actions.
    if: github.event_name == 'workflow_dispatch'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Explain missing deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::error::RENDER_DEPLOY_HOOK_URL is not configured in GitHub Actions Secrets."
          exit 1
