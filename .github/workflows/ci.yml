name: Rust CI/CD

on:
  push:
    branches:
      - "project/3D-map-medical"
  pull_request:
    branches:
      - "project/3D-map-medical"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test and build Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: backend
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: backend
        run: cargo test --locked --all-targets --all-features

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/deployment/Dockerfile \
            --tag gis-backend:ci \
            backend

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/project/3D-map-medical'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Explain skipped deployment
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::Deployment skipped because RENDER_DEPLOY_HOOK_URL is not configured in GitHub Actions Secrets."
