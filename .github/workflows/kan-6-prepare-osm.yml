name: KAN-6 - Prepare Ben Thanh sample GIS data

on:
  workflow_dispatch:
    inputs:
      confirm_scope:
        description: "Confirm the approximately 1 km² Ben Thanh Market study area"
        required: true
        type: choice
        options:
          - ben-thanh-1km2
        default: ben-thanh-1km2

permissions:
  contents: write

concurrency:
  group: kan-6-osm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Download, extract, validate and package GIS data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install GIS and conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin osmium-tool jq curl
          mkdir -p "$RUNNER_TEMP/osm-converter"
          npm install --prefix "$RUNNER_TEMP/osm-converter" osmtogeojson
          echo "NODE_PATH=$RUNNER_TEMP/osm-converter/node_modules" >> "$GITHUB_ENV"
          echo "GDAL: $(ogr2ogr --version)"
          echo "OSmium: $(osmium --version)"
          echo "Node: $(node --version)"

      - name: Create and verify 1 km² Ben Thanh study area
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ inputs.confirm_scope }}" == "ben-thanh-1km2" ]] || { echo "Unexpected study area selection"; exit 1; }
          mkdir -p data/sample/source data/sample/processed build/kan-6
          # Approximate 1 km x 1 km square centered on Ben Thanh Market.
          # Center coordinates are sourced from OpenStreetMap feature way/39514795.
          # Bounds use ~500 m in each direction at latitude 10.77257 N.
          python3 - <<'PY'
          import json
          from pathlib import Path

          # WGS84 lon/lat bounds around Ben Thanh Market (106.69802 E, 10.77257 N).
          west, south, east, north = 106.693378, 10.768079, 106.702662, 10.777061
          ring = [
              [west, south], [east, south], [east, north],
              [west, north], [west, south]
          ]
          feature = {
              "type": "Feature",
              "properties": {
                  "name": "Ben Thanh sample study area",
                  "area_note": "Approx. 1 km x 1 km AOI centered on Ben Thanh Market",
                  "center_lat": 10.77257,
                  "center_lon": 106.69802,
                  "boundary_method": "locally defined rectangular AOI; not an administrative boundary",
                  "source_reference": "https://www.openstreetmap.org/way/39514795"
              },
              "geometry": {"type": "Polygon", "coordinates": [ring]}
          }
          Path("data/sample/source/hcm_boundary.geojson").write_text(
              json.dumps({"type": "FeatureCollection", "features": [feature]}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY
          ogrinfo -ro -so data/sample/source/hcm_boundary.geojson
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("data/sample/source/hcm_boundary.geojson").read_text(encoding="utf-8"))
          features = doc.get("features", [])
          if len(features) != 1:
              raise SystemExit("Expected exactly one AOI polygon")
          geometry = features[0].get("geometry") or {}
          if geometry.get("type") != "Polygon":
              raise SystemExit("Study area must be a Polygon")
          ring = geometry.get("coordinates", [[]])[0]
          if len(ring) != 5 or ring[0] != ring[-1]:
              raise SystemExit("AOI ring must be a closed rectangle")
          xs = [p[0] for p in ring]
          ys = [p[1] for p in ring]
          xmin, xmax, ymin, ymax = min(xs), max(xs), min(ys), max(ys)
          if not (106.68 < xmin < 106.70 and 106.70 < xmax < 106.72 and
                  10.75 < ymin < 10.77 and 10.77 < ymax < 10.79):
              raise SystemExit("AOI coordinates are outside the expected Ben Thanh vicinity")
          print(f"Ben Thanh AOI extent: ({xmin}, {ymin}) - ({xmax}, {ymax})")
          print("AOI size: approximately 1 km x 1 km; locally defined, not an administrative boundary.")
          PY
          sha256sum data/sample/source/hcm_boundary.geojson | tee build/kan-6/boundary.sha256
          cat > build/kan-6/boundary-provenance.txt <<'EOF'
          Study area: Ben Thanh Market approximately 1 km² sample AOI
          Center: 10.77257, 106.69802
          Boundary method: locally defined rectangle
          Source reference: https://www.openstreetmap.org/way/39514795
          CRS: WGS 84 longitude/latitude (EPSG:4326)
          EOF
          echo "Study area: approximately 1 km² around Ben Thanh Market" >> "$GITHUB_STEP_SUMMARY"
          echo "Boundary is a locally defined sample AOI, not a historical administrative boundary." >> "$GITHUB_STEP_SUMMARY"

      - name: Download Geofabrik Vietnam extract
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 4 --retry-delay 5 \
            --output data/sample/source/vietnam-latest.osm.pbf \
            https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
          test -s data/sample/source/vietnam-latest.osm.pbf
          sha256sum data/sample/source/vietnam-latest.osm.pbf | tee build/kan-6/pbf.sha256
          stat -c 'PBF size: %s bytes' data/sample/source/vietnam-latest.osm.pbf
          echo "PBF_RETRIEVED_AT_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "PBF_SIZE_BYTES=$(stat -c '%s' data/sample/source/vietnam-latest.osm.pbf)" >> "$GITHUB_ENV"

      - name: Clip Vietnam PBF to Ben Thanh 1 km² AOI
        run: |
          set -Eeuo pipefail
          osmium extract \
            --polygon data/sample/source/hcm_boundary.geojson \
            --strategy=smart \
            data/sample/source/vietnam-latest.osm.pbf \
            --output build/kan-6/hcm-extract.osm.pbf \
            --overwrite
          test -s build/kan-6/hcm-extract.osm.pbf
          ls -lh build/kan-6/hcm-extract.osm.pbf

      - name: Prepare building footprints
        run: |
          set -Eeuo pipefail
          OSM_PBF_FILE="$PWD/build/kan-6/hcm-extract.osm.pbf" \
            bash scripts/gis/prepare_osm_data.sh

      - name: Validate outputs and write quality report
        shell: bash
        run: |
          set -Eeuo pipefail
          BOUNDARY=data/sample/processed/hcm_boundary.geojson
          BUILDINGS=data/sample/processed/hcm_buildings.geojson
          test -s "$BOUNDARY"
          test -s "$BUILDINGS"
          ogrinfo -ro -so "$BOUNDARY" | tee build/kan-6/boundary-inspection.txt
          ogrinfo -ro -so "$BUILDINGS" | tee build/kan-6/buildings-inspection.txt
          BOUNDARY_COUNT="$(ogrinfo -ro -so "$BOUNDARY" | sed -n 's/^Feature Count: //p' | head -n 1)"
          BUILDING_COUNT="$(ogrinfo -ro -so "$BUILDINGS" | sed -n 's/^Feature Count: //p' | head -n 1)"
          test "${BOUNDARY_COUNT:-0}" -ge 1
          test "${BUILDING_COUNT:-0}" -gt 0
          # Load into a temporary SQLite/GeoPackage database for attribute QA.
          ogr2ogr -f GPKG build/kan-6/qa.gpkg "$BUILDINGS" -nln buildings
          read -r NULL_IDS DUPLICATE_IDS < <(python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("build/kan-6/qa.gpkg")
          null_ids = db.execute(
              "SELECT COUNT(*) FROM buildings WHERE building_id IS NULL OR TRIM(building_id) = ''"
          ).fetchone()[0]
          duplicate_ids = db.execute(
              "SELECT COUNT(*) FROM (SELECT building_id FROM buildings GROUP BY building_id HAVING COUNT(*) > 1)"
          ).fetchone()[0]
          print(null_ids, duplicate_ids)
          db.close()
          PY
          )
          echo "Null building IDs: $NULL_IDS; duplicate ID groups: $DUPLICATE_IDS"
          if (( NULL_IDS > 0 || DUPLICATE_IDS > 0 )); then
            echo "::error::Building identifiers are null or duplicated."
            exit 1
          fi
          sha256sum "$BOUNDARY" "$BUILDINGS" | tee build/kan-6/output.sha256
          cat > data/sample/processed/quality-summary.md <<EOF
          # KAN-6 automated data quality summary

          - Study area: approximately 1 km² around Ben Thanh Market
          - Boundary source: locally defined rectangular AOI centered on OSM way 39514795
          - Building source: Geofabrik Vietnam OSM extract
          - Boundary features: $BOUNDARY_COUNT
          - Building features: $BUILDING_COUNT
          - Buildings with null building_id: $NULL_IDS
          - Duplicate building_id groups: $DUPLICATE_IDS
          - Boundary CRS / geometry inspection: see workflow logs
          - Building CRS / geometry inspection: see workflow logs
          - Source PBF SHA-256: $(cut -d ' ' -f 1 build/kan-6/pbf.sha256)
          - Output SHA-256 values: see output.sha256 in the artifact

          ## Interpretation

          This report contains automated structural and identifier checks only.
          It does not claim complete OSM coverage or replace visual inspection in QGIS.
          OSM building footprints are 2D and do not include inferred height, floors,
          population, occupancy, or epidemiological attributes.
          EOF
          cat data/sample/processed/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat > data/sample/processed/metadata.md <<EOF
          # KAN-6 generated dataset metadata

          - Study area: approximately 1 km² around Ben Thanh Market
          - Boundary source: locally defined rectangular AOI centered on OSM way 39514795
          - Boundary method: locally defined rectangular AOI
          - AOI center: 10.77257 N, 106.69802 E
          - AOI extent: 106.693378–106.702662 E, 10.768079–10.777061 N
          - Boundary provenance: see boundary-provenance.txt
          - Boundary input SHA-256: $(sha256sum data/sample/source/hcm_boundary.geojson | cut -d ' ' -f 1)
          - Building source: Geofabrik Vietnam latest extract
          - Building PBF URL: https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
          - Building PBF retrieval UTC: $PBF_RETRIEVED_AT_UTC
          - Building PBF size bytes: $PBF_SIZE_BYTES
          - Building PBF SHA-256: $(cut -d ' ' -f 1 build/kan-6/pbf.sha256)
          - GDAL: $(ogr2ogr --version)
          - Boundary features: $BOUNDARY_COUNT
          - Building features: $BUILDING_COUNT
          - Output checksums: see output.sha256 in this artifact
          - License: © OpenStreetMap contributors, ODbL

          The study boundary is a locally defined approximately 1 km² rectangle centered on Ben Thanh Market.
          Building footprints are from the downloaded Geofabrik Vietnam snapshot and clipped to this AOI.
          Buildings represent the latest available snapshot at workflow execution, not historical building data.
          EOF
          echo "Null building IDs: $NULL_IDS; duplicate ID groups: $DUPLICATE_IDS"

      - name: Commit validated GeoJSON and lightweight provenance
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            data/sample/source/hcm_boundary.geojson
            data/sample/processed/hcm_boundary.geojson
            data/sample/processed/hcm_buildings.geojson
            data/sample/processed/metadata.md
            data/sample/processed/quality-summary.md
          )
          max_bytes=$((50 * 1024 * 1024))
          too_large=false
          for file in "${files[@]}"; do
            test -s "$file"
            size="$(stat -c '%s' "$file")"
            echo "$file: $size bytes"
            if (( size > max_bytes )); then
              echo "::warning::$file exceeds 50 MiB; keeping validated data in the workflow artifact instead of committing an oversized Git blob."
              too_large=true
            fi
          done
          if [[ "$too_large" == "true" ]]; then
            echo "GeoJSON commit skipped due to the 50 MiB per-file safety limit; artifact will still be uploaded."
            echo "GeoJSON commit skipped: at least one file exceeds 50 MiB; use the workflow artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No generated GIS files changed; no commit created."
          else
            git commit -m "data(gis): add validated Ben Thanh GeoJSON sample"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Committed validated GeoJSON and lightweight provenance to ${GITHUB_REF_NAME}."
          fi

      - name: Package data and provenance
        if: success()
        run: |
          mkdir -p build/kan-6/package
          cp -f data/sample/source/hcm_boundary.geojson build/kan-6/package/ 2>/dev/null || true
          cp -f data/sample/processed/*.geojson build/kan-6/package/ 2>/dev/null || true
          cp -f data/sample/processed/quality-summary.md build/kan-6/package/ 2>/dev/null || true
          cp -f data/sample/processed/metadata.md build/kan-6/package/ 2>/dev/null || true
          cp -f build/kan-6/*.sha256 build/kan-6/package/ 2>/dev/null || true
          cp -f build/kan-6/*inspection.txt build/kan-6/package/ 2>/dev/null || true
          cp -f build/kan-6/boundary-provenance.txt build/kan-6/package/ 2>/dev/null || true
          cat > build/kan-6/package/README.md <<'EOF'
          # KAN-6 HCMC OSM data artifact

          Study area: approximately 1 km² around Ben Thanh Market, District 1.
          Boundary: locally defined rectangular AOI centered at 10.77257 N, 106.69802 E.
          Buildings: 2D OSM building footprints from the downloaded Geofabrik Vietnam snapshot, clipped to the AOI.
          Boundary coordinates, method and source reference are recorded in boundary-provenance.txt.
          CRS: GeoJSON RFC 7946 / WGS 84 longitude-latitude (EPSG:4326).
          Attribution: © OpenStreetMap contributors, ODbL.
          This artifact is a reproducible snapshot; consult quality-summary.md and checksums.
          EOF

      - name: Upload GIS data artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kan-6-ben-thanh-osm-data
          path: build/kan-6/package/
          if-no-files-found: warn
          retention-days: 30
